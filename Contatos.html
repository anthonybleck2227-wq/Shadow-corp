<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato</title>

<style>

/* RESET */
* {
    box-sizing: border-box;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: black;
    color: white;

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* FUNDO */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("https://i.imgur.com/aCLEGMG.png") center/cover no-repeat;
    opacity: 0.6;
    z-index: -1;
}

/* HEADER */
header {
    position: fixed;
    top: 0;
    width: 100%;

    background-color: rgba(42, 15, 58, 0.85);
    backdrop-filter: blur(5px);

    padding: 15px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 1000;

    box-shadow: 0 0 15px rgba(128, 0, 255, 0.3);
}

/* LOGO */
.logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ddd;
}

/* MENU */
#topo ul {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

#topo a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

#topo a:hover {
    color: #c084ff;
}

/* MAIN */
main {
    flex: 1;
    padding: 130px 20px 40px;
    text-align: center;
}

/* CAIXA DE CONTATO */
.contato {
    display: inline-block;
    background: rgba(20, 20, 20, 0.85);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(128,0,255,0.3);
    margin-top: 20px;
}

.contato p {
    margin: 10px 0;
    font-size: 16px;
}

.destaque {
    color: #FFD700;
    font-weight: bold;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 15px;
    background-color: rgba(13, 13, 13, 0.85);
    border-top: 1px solid #222;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        gap: 10px;
    }

    #topo ul {
        flex-wrap: wrap;
        justify-content: center;
    }
}

</style>
</head>

<body>

<header>
    <div class="logo">Shadow Corp</div>

    <nav id="topo">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Agentes.html">Agentes</a></li>
            <li><a href="Contatos.html">Contatos</a></li>
            <li><a href="Suas Missões.html">Relatos</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Contato</h1>

    <div class="contato">
        <p>Email: shadowcorporation@gmail.com</p>
        <p>Telefone: <span class="destaque">(11) 994002-8922</span></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 - Shadow Corp</p>
</footer>

</body>
</html>
