<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato - Shadow Corp</title>

<style>

/* RESET */
* {
    box-sizing: border-box;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: black;
    color: white;

    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* FUNDO */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("https://i.imgur.com/aCLEGMG.png") center/cover no-repeat;
    opacity: 0.6;
    z-index: -1;
}

/* HEADER */
header {
    position: fixed;
    top: 0;
    width: 100%;

    background: rgba(42, 15, 58, 0.85);
    backdrop-filter: blur(5px);

    padding: 15px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 1000;

    box-shadow: 0 0 15px rgba(128, 0, 255, 0.3);
}

/* LOGO */
.logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* MENU */
#topo ul {
    display: flex;
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
}

#topo a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

#topo a:hover {
    color: #c084ff;
}

/* MAIN */
main {
    flex: 1;
    padding: 130px 20px 40px;
    text-align: center;
}

/* CAIXA */
.form-box {
    max-width: 500px;
    margin: auto;
    background: rgba(20, 20, 20, 0.9);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(128,0,255,0.4);
}

/* TÍTULO */
.form-box h2 {
    margin-bottom: 20px;
    color: #c084ff;
}

/* INPUTS */
.form-box input,
.form-box select,
.form-box textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;

    border: none;
    border-radius: 5px;

    background: #111;
    color: white;

    outline: none;
}

/* TEXTAREA */
textarea {
    resize: none;
    height: 100px;
}

/* BOTÃO */
.form-box button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 5px;

    background: linear-gradient(45deg, #6a00ff, #c084ff);
    color: white;
    font-weight: bold;

    cursor: pointer;
    transition: 0.3s;
}

.form-box button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #c084ff;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 15px;
    background: rgba(13, 13, 13, 0.85);
    border-top: 1px solid #222;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        gap: 10px;
    }

    #topo ul {
        flex-wrap: wrap;
        justify-content: center;
    }
}

</style>
</head>

<body>

<header>
    <div class="logo">Shadow Corp</div>

    <nav id="topo">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="Agentes.html">Agentes</a></li>
            <li><a href="Contatos.html">Contatos</a></li>
            <li><a href="Suas Misões.html">Relatos</a></li>
        </ul>
    </nav>
</header>

<main>

    <div class="form-box">
        <h2>📡 Relatar Anomalia</h2>

        <form>

            <input type="text" placeholder="Seu Nome" required>

            <input type="email" placeholder="Email de Contato" required>

            <select required>
                <option value="">Tipo de Anomalia</option>
                <option>Paranormal</option>
                <option>Entidade</option>
                <option>Distúrbio de Realidade</option>
                <option>Desconhecido</option>
            </select>

            <select required>
                <option value="">Nível de Ameaça</option>
                <option>Baixo</option>
                <option>Médio</option>
                <option>Alto</option>
                <option>Crítico</option>
            </select>

            <textarea placeholder="Descreva o ocorrido..." required></textarea>

            <button type="submit">Enviar Missão</button>

        </form>
    </div>

</main>

<footer>
    <p>&copy; 2026 - Shadow Corp</p>
</footer>

</body>
</html>
