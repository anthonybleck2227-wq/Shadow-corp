<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Central de Relatórios</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:black;
    color:white;

    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* FUNDO */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("https://i.imgur.com/aCLEGMG.png")
    center/cover no-repeat;

    opacity:0.6;
    z-index:-1;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    width:100%;

    padding:15px 30px;

    background:rgba(42,15,58,0.85);
    backdrop-filter:blur(5px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:1000;

    box-shadow:0 0 15px rgba(128,0,255,0.3);
}

.logo{
    font-size:20px;
    font-weight:bold;
}

/* MENU */
#topo ul{
    display:flex;
    gap:20px;
    list-style:none;
    padding:0;
}

#topo a{
    color:white;
    text-decoration:none;
}

#topo a:hover{
    color:#c084ff;
}

/* MAIN */
main{
    flex:1;
    padding:130px 20px 40px;
    max-width:1200px;
    margin:auto;
}

/* BOX */
.box{
    background:rgba(20,20,20,0.9);

    padding:25px;
    border-radius:12px;

    margin-bottom:30px;

    box-shadow:0 0 20px rgba(128,0,255,0.3);
}

.box h2{
    margin-top:0;
    color:#c084ff;
}

/* INPUTS */
input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;

    border:none;
    border-radius:6px;

    background:#111;
    color:white;
}

textarea{
    height:120px;
    resize:none;
}

/* BOTÃO */
button{
    width:100%;
    padding:12px;

    border:none;
    border-radius:6px;

    background:linear-gradient(45deg,#6a00ff,#c084ff);

    color:white;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

/* TABELA */
table{
    width:100%;
    border-collapse:collapse;

    background:rgba(20,20,20,0.9);
}

th, td{
    border:1px solid #333;
    padding:10px;
    text-align:center;
}

th{
    background:#1a1a1a;
    color:#c084ff;
}

/* STATUS */
.status-ok{
    color:#00e676;
}

.status-andamento{
    color:#ffcc00;
}

.status-critico{
    color:#ff4d4d;
}

/* APAGAR */
.btn-apagar{
    background:#ff3030;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:15px;
    background:rgba(13,13,13,0.85);
}

/* RESPONSIVO */
@media(max-width:700px){

    header{
        flex-direction:column;
        gap:10px;
    }

    #topo ul{
        flex-wrap:wrap;
        justify-content:center;
    }

    table{
        font-size:12px;
    }
}

</style>
</head>

<body>

<header>

<div class="logo">Shadow Corp</div>

<nav id="topo">

<ul>
<li><a href="index.html">Inicio</a></li>
<li><a href="Agentes.html">Agentes</a></li>
<li><a href="Contatos.html">Contatos</a></li>
<li><a href="Suas Missões.html">Relatórios</a></li>
</ul>

</nav>

</header>

<main>

<div class="box">

<h2>📡 Enviar Relato Paranormal</h2>

<input type="text"
id="nome"
placeholder="Seu nome">

<input type="text"
id="missao"
placeholder="Título do relato">

<select id="tipo">

<option>Paranormal</option>
<option>Entidade</option>
<option>Ocultismo</option>
<option>Distúrbio de Realidade</option>
<option>Desconhecido</option>

</select>

<select id="status">

<option>Pendente</option>
<option>Investigando</option>
<option>Crítico</option>

</select>

<textarea
id="descricao"
placeholder="Descreva o ocorrido..."></textarea>

<button onclick="salvarRegistro()">
Enviar Relato
</button>

</div>

<table>

<thead>

<tr>
<th>ID</th>
<th>Nome</th>
<th>Relato</th>
<th>Tipo</th>
<th>Status</th>
<th>Descrição</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="tabelaRegistros">

</tbody>

</table>

</main>

<footer>
<p>&copy; 2026 - Shadow Corp</p>
</footer>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* COLE SUA CONFIG AQUI */

const firebaseConfig = {
  apiKey: "AIzaSyD_0MZ5LOkBw72190wXC--MH2AjrUfk1zU",
  authDomain: "shadow-corp-77287.firebaseapp.com",
  projectId: "shadow-corp-77287",
  storageBucket: "shadow-corp-77287.firebasestorage.app",
  messagingSenderId: "628000582463",
  appId: "1:628000582463:web:5ebc8ce5fa3123d108c18a",
  measurementId: "G-46CML1Z3NH"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* CARREGAR */

async function carregarRegistros(){

const tabela =
document.getElementById("tabelaRegistros");

tabela.innerHTML = "";

const querySnapshot =
await getDocs(collection(db, "registros"));

querySnapshot.forEach((docu) => {

const dado = docu.data();

let classeStatus = "";

if(dado.status === "Pendente"){
classeStatus = "status-andamento";
}

if(dado.status === "Investigando"){
classeStatus = "status-ok";
}

if(dado.status === "Crítico"){
classeStatus = "status-critico";
}

tabela.innerHTML += `

<tr id="${docu.id}">

<td>${docu.id.slice(0,5)}</td>

<td>${dado.nome}</td>

<td>${dado.missao}</td>

<td>${dado.tipo}</td>

<td class="${classeStatus}">
${dado.status}
</td>

<td>${dado.descricao}</td>

<td>

<button
class="btn-apagar"
onclick="apagarRegistro('${docu.id}')">

Apagar

</button>

</td>

</tr>

`;

});

}

/* SALVAR */

window.salvarRegistro = async function(){

const nome =
document.getElementById("nome").value;

const missao =
document.getElementById("missao").value;

const tipo =
document.getElementById("tipo").value;

const status =
document.getElementById("status").value;

const descricao =
document.getElementById("descricao").value;

if(nome === "" || missao === "" || descricao === ""){

alert("Preencha todos os campos.");

return;

}

await addDoc(collection(db, "registros"), {

nome,
missao,
tipo,
status,
descricao

});

alert("Relato enviado.");

document.getElementById("nome").value = "";
document.getElementById("missao").value = "";
document.getElementById("descricao").value = "";

carregarRegistros();

}

/* APAGAR */

window.apagarRegistro =
async function(id){

const confirmar =
confirm("Deseja apagar?");

if(!confirmar){
return;
}

await deleteDoc(doc(db, "registros", id));

carregarRegistros();

}

/* INICIAR */

carregarRegistros();

</script>

</body>
</html>
